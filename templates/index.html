<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; }
        h2 { color: #333; }
        .btn { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>AI Resume Analyzer</h2>
        <form action="/analyze" method="POST" enctype="multipart/form-data">
            <label for="resume">Mee Resume Upload Cheyandi (PDF or DOCX):</label><br><br>
            <input type="file" id="resume" name="resume" required><br><br>
            <button type="submit" class="btn">Analyze Resume</button>
        </form>
    </div>
</body>
</html>
