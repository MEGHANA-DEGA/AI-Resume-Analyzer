<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 700px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; }
        h2 { color: #28a745; }
        ul { background: #e9ecef; padding: 15px 30px; border-radius: 5px; }
        .btn { display: inline-block; text-decoration: none; background: #6c757d; color: white; padding: 10px 15px; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Resume Analysis Results</h2>
        
        <h3>Extracted Skills:</h3>
        <ul>
            {% for skill in skills %}
                <li>{{ skill }}</li>
            {% else %}
                <li>Skills emi kanipincledhu.</li>
            {% endfor %}
        </ul>

        <h3>AI Feedback & Suggestions:</h3>
        <p>{{ feedback }}</p>

        <a href="/" class="btn">Malli Upload Cheyandi</a>
    </div>
</body>
</html>
